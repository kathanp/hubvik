name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: install
        run: npm ci
      - name: gate
        run: npm run gate
      - name: publish changed public packages
        run: |
          set -euo pipefail
          fail=0
          publish_one() {
            dir="$1"
            private=$(node -p "require('./$dir/package.json').private === true")
            if [ "$private" = "true" ]; then
              return 0
            fi
            version=$(node -p "require('./$dir/package.json').version")
            # Q-19. Versions below 1.0.0 use the next dist-tag. 1.0.0 and later use latest.
            case "$version" in
              0.*) tag=next ;;
              *) tag=latest ;;
            esac
            if ! npm publish --provenance --tag "$tag" --workspace "$dir"; then
              echo "publish failed: $dir"
              fail=1
            fi
          }
          # The unscoped package is already on npm. Scoped names are not, and a
          # 404 on the first alphabetical package must not skip hubvik.
          publish_one packages/core
          for dir in packages/*; do
            if [ "$dir" = "packages/core" ]; then
              continue
            fi
            publish_one "$dir"
          done
          exit "$fail"
