name: ci-extended

# Node 24, Node 26, and Ubuntu arm. Weekly, and on demand. Not a merge gate.
on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            os: ubuntu-24.04-arm
          - node: '24'
            os: ubuntu-latest
          - node: '24'
            os: ubuntu-24.04-arm
          - node: '26'
            os: ubuntu-latest
          - node: '26'
            os: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install
        run: npm ci
      - name: gate
        run: npm run gate
