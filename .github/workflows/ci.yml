name: ci

# One merge gate. The pull request runs npm run gate on the head commit.
# A fast-forward of that commit onto main does not start this job again.
on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: node 22 / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: gate
        run: npm run gate
